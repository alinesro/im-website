<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Aline de Sá — Inner Meaning Wellbeing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F2E9; --card:#FBF7EF; --ink:#2E2A22; --muted:#5C5648;
    --sage:#7C8F6E; --sage-lt:#A9BB9A; --terra:#B5714B; --line:rgba(124,143,110,.28);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Jost',system-ui,sans-serif;
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }
  .serif{font-family:'Marcellus',serif}
  .card{
    width:100%; max-width:400px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  /* soft botanical line behind the avatar */
  .avatar-wrap{position:relative; width:210px; height:210px; margin-bottom:26px; display:flex; align-items:center; justify-content:center}
  .sprigs{position:absolute; width:78%; height:78%; left:50%; top:50%; transform:translate(-50%,-50%); opacity:.49; pointer-events:none; z-index:1}
  .avatar{position:relative; z-index:2; width:170px; height:170px; border-radius:50%;object-fit:cover; display:block;border:2px solid #7C8F6E;box-shadow:0 0 0 5px var(--cream), 0 0 0 6px rgba(124,143,110,.35), 0 10px 26px rgba(46,42,34,.12);}
  h1{margin:0; font-size:29px; font-weight:400; letter-spacing:.2px}
  .role{margin:8px 0 0; font-size:14px; color:var(--sage); font-weight:500}
  .role .dot{color:var(--line); margin:0 7px}
  .tagline{
    margin:20px 4px 30px; font-size:19px; line-height:1.55; color:var(--ink);
  }
  .links{width:100%; display:flex; flex-direction:column; gap:12px}
  a.link{
    display:flex; align-items:center; gap:16px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px 20px; text-decoration:none; color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.link:active{transform:scale(.985)}
  @media(hover:hover){a.link:hover{box-shadow:0 8px 22px rgba(46,42,34,.08)}}
  .ic{flex:0 0 22px; width:22px; height:22px; color:var(--terra)}
  .link .lbl{font-size:16px; font-weight:500}
  .link .sub{font-size:13px; color:var(--muted); margin-top:1px}
  .link .txt{display:flex; flex-direction:column; align-items:flex-start; line-height:1.2}
  .foot{margin-top:32px; display:flex; flex-direction:column; align-items:center; gap:8px}
  .foot-logo{width:150px; height:auto; display:block}
  .foot-line{margin:0; font-size:12px; color:#8A8571; line-height:1.6}
</style>
</head>
