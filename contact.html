<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact — Inner Meaning Wellbeing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDE8DC;
    --text: #3D3226;
    --sage: #8FA37E;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Marcellus', Georgia, 'Times New Roman', serif;
  }

  /* ---------- Header ---------- */

  header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(20px, 5vw, 64px);
    background-color: var(--bg);
    z-index: 1000;
  }

  .logo img {
    height: 76px;
    display: block;
    background: transparent;
    border: none;
    outline: none;
    -webkit-box-shadow: none;
    box-shadow: none;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: clamp(20px, 3vw, 48px);
    margin: 0;
    padding: 0;
  }

  nav a {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    font-size: 18px;
    position: relative;
    padding-bottom: 4px;
  }

  nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background-color: var(--sage);
    transition: width 0.3s ease;
  }

  nav a:hover::after {
    width: 100%;
  }

  nav a.current {
    color: var(--sage);
  }

  nav a.current::after {
    width: 100%;
  }

  nav li.has-dropdown {
    position: relative;
  }

  .dropdown {
    display: flex;
    flex-direction: column;
    gap: 0.2cm;
    list-style: none;
    margin: 0;
    padding: 8px 0;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 190px;
    background-color: rgba(143, 163, 126, 0.55);
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(61, 50, 38, 0.12);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    z-index: 1001;
  }

  .has-dropdown:hover .dropdown,
  .has-dropdown.is-open .dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .dropdown a {
    display: block;
    padding: 4px 20px;
    font-size: 16px;
    white-space: nowrap;
  }

  .dropdown a::after {
    content: none;
  }

  .dropdown a:hover {
    color: var(--bg);
  }

  .dropdown li:first-child {
    margin-top: 0.2cm;
  }

  .dropdown li:last-child {
    margin-bottom: 0.2cm;
  }

  /* ---------- Shared content sections ---------- */

  main {
    padding-top: 84px;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 clamp(24px, 6vw, 80px);
  }

  .content-section {
    padding: 64px 0;
  }

  .content-section:first-of-type {
    padding-top: calc(16px + 1cm);
  }

  .btn {
    display: inline-block;
    background-color: #9dae8c;
    color: #f2ede1;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    font-size: 1rem;
    padding: 16px 40px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.3s ease;
  }

  .btn:hover {
    background-color: #7C9068;
    transform: translateY(-2px);
  }

  /* ---------- Contact grid ---------- */

  .contact-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: calc(64px + 2cm);
    align-items: start;
    margin-left: -3cm;
    margin-right: -3cm;
  }

  .contact-form-title {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 22px;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 28px;
  }

  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: calc(100% + 1cm);
  }

  .form-row {
    display: flex;
    gap: 18px;
  }

  .form-row .form-field {
    flex: 1;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-field label {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    font-size: 0.85rem;
    color: var(--text);
  }

  .required-mark {
    color: #C1443B;
  }

  .form-field input,
  .form-field textarea {
    width: 100%;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-size: 1rem;
    color: var(--text);
    background-color: transparent;
    border: 1px solid rgba(61, 50, 38, 0.35);
    border-radius: 999px;
    padding: 14px 24px;
    transition: border-color 0.2s ease;
  }

  .form-field textarea {
    border-radius: 28px;
    resize: vertical;
  }

  .form-field input:focus,
  .form-field textarea:focus {
    outline: none;
    border-color: var(--sage);
  }

  .contact-submit {
    align-self: flex-start;
    margin-top: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }

  .contact-direct-intro {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 22px;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 28px;
  }

  .contact-direct-list {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .contact-direct-item {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 1.05rem;
    color: var(--text);
  }

  .contact-direct-item:hover {
    color: var(--sage);
  }

  .contact-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    color: var(--sage);
  }

  .contact-icon svg {
    width: 100%;
    height: 100%;
  }

  .urgent-support-link {
    display: inline-block;
    margin-top: 76px;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 14px;
    color: rgba(61, 50, 38, 0.55);
    text-decoration: none;
  }

  .urgent-support-link:hover {
    text-decoration: underline;
  }

  /* ---------- Footer ---------- */

  footer {
    background-color: var(--bg);
    text-align: center;
    padding: 0.3cm 24px;
    border-top: 1px solid rgba(61, 50, 38, 0.12);
  }

  .footer-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .footer-logo {
    display: block;
    height: 61.5px;
    width: auto;
  }

  .footer-copy {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 0.85rem;
    color: rgba(61, 50, 38, 0.6);
    margin: 0;
  }

  .menu-toggle {
    display: none;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    z-index: 1100;
  }

  .hamburger span {
    display: block;
    height: 2px;
    width: 100%;
    background-color: var(--text);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 768px) {
    .dropdown {
      position: static;
      opacity: 1;
      visibility: visible;
      transform: none;
      box-shadow: none;
      background: transparent;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .has-dropdown.is-open .dropdown {
      max-height: 200px;
      padding: 8px 0 0 16px;
    }

    .logo img {
      height: 56px;
    }

    .contact-grid {
      grid-template-columns: 1fr;
      gap: 48px;
      margin-left: 0;
      margin-right: 0;
    }

    .form-row {
      flex-direction: column;
      gap: 18px;
    }

    nav {
      position: fixed;
      top: 84px;
      right: 0;
      width: 240px;
      height: calc(100vh - 84px);
      background-color: var(--bg);
      transform: translateX(100%);
      transition: transform 0.35s ease;
      box-shadow: -2px 0 12px rgba(61, 50, 38, 0.08);
    }

    nav ul {
      flex-direction: column;
      align-items: flex-start;
      padding: 40px 32px;
      gap: 28px;
    }

    .hamburger {
      display: flex;
    }

    .menu-toggle:checked ~ nav {
      transform: translateX(0);
    }

    .menu-toggle:checked ~ .hamburger span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle:checked ~ .hamburger span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle:checked ~ .hamburger span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="index.html"><img src="logo.png" alt="Inner Meaning Wellbeing"></a>
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li class="has-dropdown">
          <a href="contact.html" class="current">Contact</a>
          <ul class="dropdown">
            <li><a href="book.html">Book a Session</a></li>
            <li><a href="extra-support.html">Extra Support</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
  </main>

  <footer>
    <div class="footer-content">
      <img src="logo-2.png" alt="Inner Meaning Wellbeing" class="footer-logo">
      <p class="footer-copy">&copy; 2026 Inner Meaning Wellbeing. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      var item = document.querySelector('.has-dropdown');
      var trigger = item ? item.querySelector('a') : null;
      if (!item || !trigger) return;

      trigger.addEventListener('click', function (e) {
        e.preventDefault();
        item.classList.toggle('is-open');
      });
    })();
  </script>

</body>
</html>
